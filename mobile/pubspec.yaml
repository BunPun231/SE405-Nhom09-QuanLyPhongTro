name: room_rental_mobile
description: "Smart Room Rental SaaS - Mobile Application (Flutter)"
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  http: ^1.6.0
  shared_preferences: ^2.5.5
  google_mlkit_face_detection: ^0.10.0
  tflite_flutter: ^0.12.1
  camera: ^0.10.5
  image: ^4.1.7
  intl: ^0.20.3
  image_picker: ^1.1.2
  path_provider: ^2.1.4
  open_filex: ^4.5.0
  fl_chart: ^0.69.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/models/mobile_face_net.tflite
